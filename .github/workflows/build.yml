name: Build and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the installed edition
        run: dotnet build NvTune.slnx -c Release -p:Portable=false
      - name: Test the installed edition
        run: dotnet run --project tests/NvTune.Tests -c Release -p:Portable=false --no-build
      - name: Render the installed edition UI
        run: dotnet run --project tests/NvTune.Tests -c Release -p:Portable=false --no-build -- --render-ui artifacts/ui-installed
      - name: Build the portable edition
        run: dotnet build NvTune.slnx -c Release -p:Portable=true
      - name: Test the portable edition
        run: dotnet run --project tests/NvTune.Tests -c Release -p:Portable=true --no-build
      - name: Render the portable edition UI
        run: dotnet run --project tests/NvTune.Tests -c Release -p:Portable=true --no-build -- --render-ui artifacts/ui-portable
      - name: Publish and verify both standalone Windows executables
        shell: pwsh
        run: ./scripts/Publish-Release.ps1 -OutputDirectory artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: NvTune-win-x64
          path: |
            artifacts/release/NvTuneApp.exe
            artifacts/release/NvTunePortable.exe
          if-no-files-found: error
