name: Build and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build NvTune.slnx -c Release
      - run: dotnet run --project tests/NvTune.Tests -c Release --no-build
      - run: dotnet run --project tests/NvTune.Tests -c Release --no-build -- --render-ui artifacts/ui
      - name: Publish and verify the standalone Windows executable
        shell: pwsh
        run: ./scripts/Publish-Release.ps1 -OutputDirectory artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: NvTuneApp-win-x64
          path: artifacts/release/NvTuneApp.exe
          if-no-files-found: error
