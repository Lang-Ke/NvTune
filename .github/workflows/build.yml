name: Build and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build NvTune.slnx -c Release
      - run: dotnet run --project tests/NvTune.Tests -c Release --no-build
      - run: dotnet run --project tests/NvTune.Tests -c Release --no-build -- --render-ui artifacts/ui
